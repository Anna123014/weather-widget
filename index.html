<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>济南生活挂件</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            transition: color 0.5s ease, background-color 0.5s ease;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #e0e5ec;
            padding: 20px;
        }

        .widget {
            position: relative;
            overflow: hidden;
            background: #ffffff;
            border-radius: 24px;
            padding: 28px 32px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            z-index: 1;
        }

        .widget:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.15);
        }

        .content-layer {
            position: relative;
            z-index: 10;
        }

        /* ============================================================
           天气动画专属 CSS (包含日夜区分)
           ============================================================ */
        
        #weather-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            border-radius: 24px;
            overflow: hidden;
            transition: background 1s ease;
        }

        /* --- 基础背景 --- */
        .bg-day-sunny { background: linear-gradient(120deg, #fffde7 0%, #fff59d 100%); }
        .bg-night-sunny { background: linear-gradient(120deg, #1a1a2e 0%, #16213e 100%); }
        .bg-day-rainy { background: linear-gradient(to bottom, #cfd9df 0%, #e2ebf0 100%); }
        .bg-night-rainy { background: linear-gradient(to bottom, #2c3e50 0%, #000000 100%); }
        .bg-day-cloudy { background: linear-gradient(to bottom, #e0eafc 0%, #cfdef3 100%); }
        .bg-night-cloudy { background: linear-gradient(to bottom, #232526 0%, #414345 100%); }
        .bg-day-snowy { background: linear-gradient(to bottom, #e6e9f0 0%, #eef1f5 100%); }
        .bg-night-snowy { background: linear-gradient(to bottom, #2b303b 0%, #16181d 100%); }

        /* --- 文字日夜变色 --- */
        .text-night .clock { color: #f8f9fa; }
        .text-night .clock .seconds { color: #adb5bd; }
        .text-night .date-line { color: #ced4da; }
        .text-night .weather-info .city, .text-night .weather-right .temp { color: #f8f9fa; }
        .text-night .weather-info .desc, .text-night .weather-right .feels { color: #ced4da; }
        .text-night .clothing-tip { background: rgba(0, 0, 0, 0.4); border-left-color: #6c5ce7; }
        .text-night .clothing-tip .tip-text { color: #e9ecef; }
        .text-night .refresh-btn { color: #ced4da; border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); }
        .text-night .refresh-btn:hover { background: rgba(255,255,255,0.2); color: #fff; }
        .text-night .divider { background: linear-gradient(to right, transparent, rgba(255,255,255,0.2), transparent); }

        /* --- 太阳与月亮 --- */
        .sun {
            position: absolute; top: 20px; right: 30px; width: 80px; height: 80px;
            background: #ffca28; border-radius: 50%;
            box-shadow: 0 0 40px 20px rgba(255, 202, 40, 0.6);
            animation: sun-pulse 4s infinite alternate;
        }
        @keyframes sun-pulse {
            0% { transform: scale(1); box-shadow: 0 0 40px 20px rgba(255, 202, 40, 0.6); }
            100% { transform: scale(1.1); box-shadow: 0 0 60px 30px rgba(255, 202, 40, 0.8); }
        }

        .moon {
            position: absolute; top: 20px; right: 30px; width: 60px; height: 60px;
            background: #f1f2f6; border-radius: 50%;
            box-shadow: inset -15px -15px 0 0 #1a1a2e, 0 0 20px 5px rgba(255, 255, 255, 0.2);
            animation: moon-float 6s infinite ease-in-out;
        }
        @keyframes moon-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* --- 雨滴 --- */
        .rain-drop {
            position: absolute; width: 2px; height: 20px;
            border-radius: 2px; top: -20px; animation: rain-fall linear infinite;
        }
        .rain-drop-day { background: rgba(0, 0, 0, 0.2); }
        .rain-drop-night { background: rgba(255, 255, 255, 0.4); box-shadow: 0 0 5px rgba(255,255,255,0.5); }
        @keyframes rain-fall {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(450px); opacity: 0; }
        }

        /* --- 云朵 --- */
        .cloud {
            position: absolute; border-radius: 50px; filter: blur(5px); animation: cloud-move linear infinite;
        }
        .cloud-day { background: rgba(255, 255, 255, 0.8); }
        .cloud-night { background: rgba(255, 255, 255, 0.15); }
        @keyframes cloud-move {
            0% { transform: translateX(-100px); }
            100% { transform: translateX(500px); }
        }

        /* --- 雪花 --- */
        .snow-flake {
            position: absolute; top: -20px; animation: snow-fall linear infinite;
        }
        .snow-flake-day { color: #fff; text-shadow: 0 0 5px rgba(0,0,0,0.1); }
        .snow-flake-night { color: #ced4da; text-shadow: 0 0 8px rgba(255,255,255,0.8); }
        @keyframes snow-fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(450px) rotate(360deg); opacity: 0; }
        }

        /* ============================================================
           内容区样式
           ============================================================ */
        .time-section { text-align: center; margin-bottom: 20px; }
        .clock {
            font-size: 56px; font-weight: 700; color: #1a1a2e;
            letter-spacing: 2px; line-height: 1.1; font-variant-numeric: tabular-nums;
        }
        .clock .seconds { font-size: 32px; color: #6c757d; font-weight: 500; }
        .date-line {
            font-size: 15px; color: #495057; margin-top: 8px;
            display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap;
        }
        .date-line .lunar {
            background: rgba(255, 255, 255, 0.6); color: #4f46e5;
            padding: 2px 10px; border-radius: 20px; font-size: 13px; font-weight: 600;
            backdrop-filter: blur(5px);
        }
        .divider {
            height: 1px; background: linear-gradient(to right, transparent, rgba(0,0,0,0.1), transparent);
            margin: 16px 0;
        }
        
        .weather-section { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; }
        .weather-left { display: flex; align-items: center; gap: 16px; }
        .weather-icon { font-size: 52px; line-height: 1; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }
        .weather-info .city { font-size: 16px; font-weight: 700; color: #1a1a2e; }
        .weather-info .desc { font-size: 14px; color: #495057; margin-top: 2px; font-weight: 500; }
        .weather-right { text-align: right; }
        .weather-right .temp { font-size: 38px; font-weight: 700; color: #1a1a2e; line-height: 1; }
        .weather-right .feels { font-size: 12px; color: #6c757d; margin-top: 4px; font-weight: 500; }

        .clothing-tip {
            background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px);
            border-radius: 12px; padding: 12px 16px; margin-top: 16px;
            display: flex; align-items: flex-start; gap: 10px;
            border-left: 4px solid #4f46e5;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .clothing-tip .tip-icon { font-size: 20px; line-height: 1.2; }
        .clothing-tip .tip-text { font-size: 13px; color: #343a40; line-height: 1.5; font-weight: 500; }

        .loading, .error { font-size: 14px; text-align: center; padding: 16px 0; color: #6c757d; font-weight: 500; }
        .error { color: #dc3545; background: rgba(255, 245, 245, 0.8); border-radius: 8px; }

        .refresh-btn {
            display: block; margin: 16px auto 0; background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(0,0,0,0.1); border-radius: 20px; padding: 6px 18px;
            font-size: 12px; color: #495057; cursor: pointer; transition: all 0.2s; font-weight: 500;
        }
        .refresh-btn:hover { background: #fff; border-color: #adb5bd; color: #1a1a2e; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="widget" id="widgetContainer">
    <!-- 天气动画层 -->
    <div id="weather-animation"></div>

    <!-- 内容层 -->
    <div class="content-layer">
        <div class="time-section">
            <div class="clock" id="clock">
                --:--<span class="seconds">:--</span>
            </div>
            <div class="date-line">
                <span id="dateText">加载中...</span>
                <span class="lunar" id="lunarText">农历</span>
            </div>
        </div>

        <div class="divider"></div>

        <div id="weatherContainer">
            <div class="loading">正在获取济南天气...</div>
        </div>

        <button class="refresh-btn" onclick="fetchWeather()">🔄 刷新天气</button>
    </div>
</div>

<script>
    // ============================================================
    // 1. 时钟逻辑
    // ============================================================
    function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('clock').innerHTML = `${hours}:${minutes}<span class="seconds">:${seconds}</span>`;

        const year = now.getFullYear();
        const month = now.getMonth() + 1;
        const day = now.getDate();
        const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
        const weekday = weekdays[now.getDay()];
        document.getElementById('dateText').textContent = `${year}年${month}月${day}日 星期${weekday}`;
        document.getElementById('lunarText').textContent = '农历十月初一'; 
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ============================================================
    // 2. 天气与动态日夜动画逻辑
    // ============================================================
    const JINAN_LAT = 36.65;
    const JINAN_LON = 117.12;

    function getWeatherDesc(code) {
        const map = {
            0: '晴', 1: '大部晴朗', 2: '多云', 3: '阴', 45: '雾', 48: '霜雾',
            51: '小毛毛雨', 53: '中毛毛雨', 55: '大毛毛雨', 61: '小雨', 63: '中雨', 65: '大雨',
            71: '小雪', 73: '中雪', 75: '大雪', 80: '小阵雨', 81: '中阵雨', 82: '强阵雨', 95: '雷暴'
        };
        return map[code] || '未知';
    }

    function getWeatherIcon(code, isDay) {
        // 夜晚图标替换
        if (code === 0) return isDay ? '☀️' : '🌙';
        if (code <= 2) return isDay ? '⛅' : '☁️';
        if (code === 3) return '☁️';
        if (code >= 45 && code <= 48) return '🌫️';
        if (code >= 51 && code <= 67) return isDay ? '🌧️' : '🌧️';
        if (code >= 71 && code <= 77) return '❄️';
        if (code >= 80 && code <= 82) return '🌧️';
        if (code >= 95) return '⛈️';
        return isDay ? '🌤️' : '☁️';
    }

    function getClothingTip(temp, weatherCode, isDay) {
        let tip = ""; let icon = "👕";
        if (temp >= 30) { tip = "天气炎热，建议穿短袖、短裤，注意防暑降温。"; icon = "🩳"; }
        else if (temp >= 25) { tip = "天气较热，建议穿短袖、薄长裤，注意室内外温差。"; icon = "👕"; }
        else if (temp >= 20) { tip = "天气舒适，建议穿长袖衬衫、薄外套。"; icon = "👔"; }
        else if (temp >= 15) { tip = "天气微凉，建议穿风衣、夹克、卫衣。"; icon = "🧥"; }
        else if (temp >= 10) { tip = "天气较冷，建议穿厚外套、毛衣，注意防风。"; icon = "🧥"; }
        else if (temp >= 5) { tip = "天气寒冷，建议穿棉服、羽绒服。"; icon = "🧣"; }
        else { tip = "天气严寒，务必穿厚羽绒服，戴好帽子、手套。"; icon = "🧣"; }

        // 结合天气和昼夜
        if (weatherCode >= 51 && weatherCode <= 67) tip += " 有雨，出门带伞。";
        else if (weatherCode >= 71 && weatherCode <= 77) tip += " 有雪，路面湿滑注意防滑。";
        else if (weatherCode >= 95) tip += " 有雷暴，注意安全。";
        
        // 夜间附加提示
        if (!isDay) {
            tip += " 夜间气温较低，注意保暖。";
        }

        return { icon, tip };
    }

    // 核心：根据天气和昼夜生成动画
    function renderWeatherAnimation(weatherCode, isDay) {
        const animLayer = document.getElementById('weather-animation');
        const widget = document.getElementById('widgetContainer');
        animLayer.innerHTML = ''; 
        animLayer.className = ''; 
        widget.className = 'widget'; // 重置主题

        const dayNight = isDay ? 'day' : 'night';
        const dropClass = isDay ? 'rain-drop-day' : 'rain-drop-night';
        const cloudClass = isDay ? 'cloud-day' : 'cloud-night';
        const snowClass = isDay ? 'snow-flake-day' : 'snow-flake-night';

        // 如果晚上，给整个挂件加上夜间文字反色类
        if (!isDay) {
            widget.classList.add('text-night');
        }

        // 晴天类 (0, 1)
        if (weatherCode === 0 || weatherCode === 1) {
            animLayer.classList.add(`bg-${dayNight}-sunny`);
            if (isDay) {
                const sun = document.createElement('div');
                sun.className = 'sun';
                animLayer.appendChild(sun);
            } else {
                const moon = document.createElement('div');
                moon.className = 'moon';
                animLayer.appendChild(moon);
            }
        } 
        // 雨类 (51-67, 80-82, 95)
        else if ((weatherCode >= 51 && weatherCode <= 67) || (weatherCode >= 80 && weatherCode <= 82) || weatherCode >= 95) {
            animLayer.classList.add(`bg-${dayNight}-rainy`);
            for (let i = 0; i < 30; i++) {
                const drop = document.createElement('div');
                drop.className = `rain-drop ${dropClass}`;
                drop.style.left = `${Math.random() * 100}%`;
                drop.style.animationDuration = `${0.5 + Math.random() * 0.5}s`;
                drop.style.animationDelay = `${Math.random() * 2}s`;
                animLayer.appendChild(drop);
            }
        } 
        // 雪类 (71-77, 85-86)
        else if ((weatherCode >= 71 && weatherCode <= 77) || (weatherCode >= 85 && weatherCode <= 86)) {
            animLayer.classList.add(`bg-${dayNight}-snowy`);
            for (let i = 0; i < 20; i++) {
                const flake = document.createElement('div');
                flake.className = `snow-flake ${snowClass}`;
                flake.textContent = '❅'; 
                flake.style.left = `${Math.random() * 100}%`;
                flake.style.fontSize = `${10 + Math.random() * 10}px`;
                flake.style.animationDuration = `${2 + Math.random() * 2}s`;
                flake.style.animationDelay = `${Math.random() * 2}s`;
                animLayer.appendChild(flake);
            }
        } 
        // 多云/阴天类 (2, 3, 45, 48)
        else {
            animLayer.classList.add(`bg-${dayNight}-cloudy`);
            for (let i = 0; i < 4; i++) {
                const cloud = document.createElement('div');
                cloud.className = `cloud ${cloudClass}`;
                const width = 60 + Math.random() * 60;
                cloud.style.width = `${width}px`;
                cloud.style.height = `${width * 0.4}px`;
                cloud.style.top = `${10 + Math.random() * 40}%`;
                cloud.style.animationDuration = `${15 + Math.random() * 10}s`;
                cloud.style.animationDelay = `${Math.random() * 5}s`;
                animLayer.appendChild(cloud);
            }
        }
    }

    async function fetchWeather() {
        const container = document.getElementById('weatherContainer');
        container.innerHTML = '<div class="loading">正在获取济南天气...</div>';

        try {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${JINAN_LAT}&longitude=${JINAN_LON}&current=temperature_2m,apparent_temperature,weather_code,is_day&timezone=Asia/Shanghai`;
            const response = await fetch(url);
            if (!response.ok) throw new Error('网络请求失败');

            const data = await response.json();
            const current = data.current;

            const temp = Math.round(current.temperature_2m);
            const feelsLike = Math.round(current.apparent_temperature);
            const weatherCode = current.weather_code;
            const isDay = current.is_day === 1; // 1为白天，0为夜晚

            const desc = getWeatherDesc(weatherCode);
            const icon = getWeatherIcon(weatherCode, isDay);
            const clothing = getClothingTip(feelsLike, weatherCode, isDay);

            // 渲染动态背景（传入isDay判断）
            renderWeatherAnimation(weatherCode, isDay);

            // 渲染文字内容
            container.innerHTML = `
                <div class="weather-section">
                    <div class="weather-left">
                        <div class="weather-icon">${icon}</div>
                        <div class="weather-info">
                            <div class="city">山东 · 济南</div>
                            <div class="desc">${desc}</div>
                        </div>
                    </div>
                    <div class="weather-right">
                        <div class="temp">${temp}°</div>
                        <div class="feels">体感 ${feelsLike}°</div>
                    </div>
                </div>
                <div class="clothing-tip">
                    <div class="tip-icon">${clothing.icon}</div>
                    <div class="tip-text"><strong>穿衣建议：</strong>${clothing.tip}</div>
                </div>
            `;
        } catch (error) {
            console.error('天气获取失败:', error);
            container.innerHTML = '<div class="error">⚠️ 天气加载失败，请点击下方刷新重试</div>';
        }
    }

    fetchWeather();
    setInterval(fetchWeather, 30 * 60 * 1000);

</script>

</body>
</html>
